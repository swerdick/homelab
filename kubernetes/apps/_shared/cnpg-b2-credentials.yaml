    REGION: ENC[AES256_GCM,data:GR2JkRks3CDGbqg=,iv:ucy2XkEBiVJhBaLRRAXbbia+Sp7msqYgUOy5TsnehV4=,tag:cN6RJetj00rs+5faBupmDg==,type:str]
