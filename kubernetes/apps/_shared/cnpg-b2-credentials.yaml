# Backblaze B2 credentials for CNPG's Barman Cloud backups.
#
# One Secret per namespace, because `ObjectStore` is namespaced and the plugin
# resolves `barmanObjectName` strictly against the owning Cluster's namespace —
# there is no cross-namespace reference mechanism, so the credential genuinely
# has to exist four times. Keeping all four documents in ONE file (the
# _shared/ single-source-of-truth idea, same spirit as tirion-ca.crt next door)
# means a B2 key rotation is one `sops` edit rather than four.
#
# Rotating: `sops kubernetes/apps/_shared/cnpg-b2-credentials.yaml`, replace the
# value in all four documents (a global substitute — they are identical), save.
# The `cnpg.io/reload: "true"` label makes the running instances pick up the new
# key without a manual reload.
#
# Scope: the key is restricted to the `vingilot-cnpg-backups` bucket ONLY, so it
# cannot reach restic's `earendil-vingilot-internal` repo (and vice versa). It
# needs deleteFiles as well as read/write — `retentionPolicy` on the ObjectStore
# shells out to `barman-cloud-backup-delete`, which silently fails to prune
# without it.
#
# REGION lives in here rather than in the ObjectStore because the CRD types
# `s3Credentials.region` as a secretKeySelector ("the reference to the secret
# containing the region"), not a plain string.
apiVersion: v1
kind: Secret
metadata:
    name: cnpg-b2-credentials
    namespace: harbor
    labels:
        cnpg.io/reload: "true"
type: Opaque
stringData:
    ACCESS_KEY_ID: ENC[AES256_GCM,data:p9VqdZeIVcScZYjPh9Nhvmwr/Ecb12xuhg==,iv:2h9BBiIA5kda7RZIYXVU40ZtKoUvhAwSpUtOBZ33Jio=,tag:I2/i6lP6YNZcR+1a9fGdMg==,type:str]
