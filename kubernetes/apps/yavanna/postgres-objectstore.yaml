---
# Barman Cloud object store for yavanna's Postgres — Backblaze B2.
# Full rationale for every field lives in kubernetes/apps/harbor/
# postgres-objectstore.yaml; this is the same shape with its own prefix.
#
# WHY THIS IS HERE AND NOT IN THE YAVANNA REPO: yavanna owns its own manifests
# under deploy/ in github.com/swerdick/yavanna, but that repo's Flux
# Kustomization (source.yaml, next door) has no `decryption:` block — unlike
# every other Kustomization in this repo — so a SOPS Secret committed there
# would arrive still encrypted. The credential therefore has to ride the
# `apps` Kustomization, and the ObjectStore is kept alongside it so the two
# stay in one place. Only the Cluster's `plugins:` stanza lives in the app
# repo. If that Kustomization ever gains decryption, this can move across.
#
# NB: no namespace.yaml here on purpose — the yavanna namespace is created by
# the external repo. Two Flux Kustomizations owning one Namespace flap on
# every reconcile. On a cold bootstrap this may fail once until the namespace
# exists; retryInterval: 1m self-heals it.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: yavanna-db-b2
  namespace: yavanna
spec:
  configuration:
    destinationPath: s3://vingilot-cnpg-backups/
    endpointURL: https://s3.us-east-005.backblazeb2.com
    s3Credentials:
      accessKeyId:
        name: cnpg-b2-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-b2-credentials
        key: ACCESS_SECRET_KEY
      region:
        name: cnpg-b2-credentials
        key: REGION
    wal:
      compression: zstd
      maxParallel: 2
    data:
      compression: gzip
      jobs: 2

  # Sibling of `configuration`, not nested inside it.
  retentionPolicy: "30d"

  instanceSidecarConfiguration:
    env:
      # Backblaze rejects boto3's default CRC32 integrity headers.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
    resources:
      # 128Mi survives WAL archiving but OOMKills barman-cloud-backup the
      # moment a base backup runs (exit 137, surfacing as a misleading
      # "rpc error ... EOF" on the Backup CR) — Python plus boto3 is ~100 MiB
      # resident before any upload buffer. Diagnosed on harbor; see the fuller
      # note in kubernetes/apps/harbor/postgres-objectstore.yaml.
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
