# The plaintext password lives in Bitwarden (no machine consumer needs it,
# unlike loki's — browsers prompt and cache it).
#
# To rotate: regenerate with
#   htpasswd -nbB pseudo "<new-password>"
# then `sops kubernetes/gpu/comfyui/comfyui-basic-auth.yaml` to paste the
# new line into `users`, and update Bitwarden to match.
