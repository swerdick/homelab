# aglarond (CT 131) — restic offsite backups: GID-10000 passthrough + unit config.
#
# Root cause this codifies (diagnosed 2026-08-03): the /bulk media trees were
# restructured to `2770 :10000` for the k8s supplementalGroups model, which cut
# off aglarond's unprivileged mapped-root (host uid/gid 100000) entirely —
# restic-media uploaded 0 bytes per run for months (hollow-but-fresh-looking
# snapshots in B2), and restic-host partial-failed on two newer /etc dirs.
#
# The fix mirrors how the smb CT (121) and k8s pods get media access: membership
# in host group 10000, granted here by mapping container gid 10000 straight
# through (lxc.idmap) and putting the restic-media unit in that group. No host
# permission loosening, no ACL second-system.
#
# Also codified here (2026-09-01): the ComfyUI backup slice — mp8/mp9 ro
# binds of comfyui-user (hand-built workflows, nightly) and comfyui/loras
# (curated downloads, weekly) + their include-file lines + the
# restic-backups shares-group drop-in. Checkpoints deliberately excluded
# (multi-GB, re-downloadable).
#
# Also codified here (added 2026-08-09): resource-control and schedule
# drop-ins for all three restic units. The 02:00-03:00 UTC slots sat in
# prime evening gaming hours (22:00-23:00 ET) and raced the ~23:15 ET fleet
# shutdown, which killed long B2 uploads mid-flight; the units also ran
# completely unthrottled. The .service/.timer files themselves still live
# only on the box — the drop-ins are the managed layer on top.
#
# Two plays: host-side (PVE conf + subgid) then guest-side (group, drop-ins,
# excludes). Idempotent; untargeted hosts are untouched.
#
# Run from ansible/:
#   ansible-playbook playbooks/setup-aglarond.yaml --check --diff

- name: Aglarond host side — gid 10000 passthrough into CT 131
  hosts: proxmox_hosts # = earendil (the PVE node carrying CT 131)
  become: true
  vars:
    aglarond_ctid: 131

  tasks:
    - name: Allow root to map host gid 10000 into containers
      # Prerequisite for the lxc.idmap 'g 10000 10000 1' line below. Was
      # already present (the smb CT relies on it); managed here so a host
      # rebuild reproduces it.
      ansible.builtin.lineinfile:
        path: /etc/subgid
        line: "root:10000:1"

    - name: Map container gid 10000 to host gid 10000 (lxc.idmap)
      # Exactly these four lines — a partial/duplicated set prevents CT start
      # (see the idmap troubleshooting note in descriptions/smb.md and
      # descriptions/aglarond.md). lineinfile keeps them as plain lxc.* lines:
      # pct chokes on '#' comment markers inside CT confs.
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ aglarond_ctid }}.conf"
        line: "{{ item }}"
      loop:
        - "lxc.idmap: u 0 100000 65536"
        - "lxc.idmap: g 0 100000 10000"
        - "lxc.idmap: g 10000 10000 1"
        - "lxc.idmap: g 10001 110001 55535"
      notify: Warn CT config changed

    - name: Bind-mount the ComfyUI user data + LoRAs for offsite backup (mp8/mp9)
      # comfyui-user holds hand-built workflows — tiny, irreplaceable,
      # deliberately excluded from vzdump (the ai-models dataset is backup=0)
      # so restic is its only protection. loras protects curated downloads
      # against upstream deletion (civitai models vanish), weekly is enough.
      # Both ro=1 like the other restic sources. (Checkpoints stay
      # unprotected by choice: multi-GB and re-downloadable.)
      ansible.builtin.lineinfile:
        path: "/etc/pve/lxc/{{ aglarond_ctid }}.conf"
        regexp: "^{{ item.slot }}:"
        line: "{{ item.slot }}: {{ item.src }},mp={{ item.dst }},ro=1"
        insertafter: '^mp[0-9]+:'
      loop:
        - { slot: mp8, src: /bulk/ai-models/comfyui-user, dst: /srv/comfyui-user }
        - { slot: mp9, src: /bulk/ai-models/comfyui/loras, dst: /srv/comfyui-loras }
        # extra/loras = the Finder-dropped (smb-writable) LoRA tree — the
        # curated set most worth protecting against upstream deletion.
        - { slot: mp10, src: /bulk/ai-models/extra/loras, dst: /srv/comfyui-extra-loras }
      notify: Warn CT config changed

  handlers:
    - name: Warn CT config changed
      # idmap changes only apply on CT restart; restarting mid-backup kills the
      # run (uploads checkpoint, but the scan restarts), so timing stays a
      # deliberate operator decision — mirrors setup-anduril-lxc.yaml.
      ansible.builtin.debug:
        msg: >-
          /etc/pve/lxc/{{ aglarond_ctid }}.conf changed — takes effect on the
          next CT restart (pct reboot {{ aglarond_ctid }}). Avoid restarting
          while a restic run is in flight.

- name: Aglarond guest side — restic unit access + excludes
  hosts: aglarond
  become: true

  tasks:
    - name: Create the shares group (container gid 10000)
      # Same name/gid as in the smb CT. With the idmap above, container gid
      # 10000 IS host gid 10000 — the group the /bulk media trees grant.
      ansible.builtin.group:
        name: shares
        gid: 10000

    - name: Create the restic service + timer drop-in directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - restic-backups.service.d
        - restic-backups.timer.d
        - restic-host.service.d
        - restic-host.timer.d
        - restic-media.service.d
        - restic-media.timer.d

    - name: Run restic-media with the shares group
      ansible.builtin.copy:
        dest: /etc/systemd/system/restic-media.service.d/media-group.conf
        mode: "0644"
        content: |
          [Service]
          SupplementaryGroups=10000
      notify: Reload systemd

    - name: Run restic-backups with the shares group too
      # Needed since /srv/comfyui-user joined its sources — the ai-models
      # dataset is 2770 root:10000 like the media trees, unreadable to the
      # bare mapped root. Same mechanism as restic-media above.
      ansible.builtin.copy:
        dest: /etc/systemd/system/restic-backups.service.d/shares-group.conf
        mode: "0644"
        content: |
          [Service]
          SupplementaryGroups=10000
      notify: Reload systemd

    - name: Add the ComfyUI sources to the restic include files
      # The on-box units read sources from --files-from lists, so new
      # sources are one managed line each — no unit edits. create: false
      # on purpose: if the include file is missing, this box is a fresh
      # rebuild mid-restore and a loud failure beats silently creating a
      # file that backs up ONLY the comfyui paths.
      ansible.builtin.lineinfile:
        path: "/root/.config/restic/{{ item.file }}"
        line: "{{ item.line }}"
        create: false
      loop:
        - { file: includes-backups.txt, line: /srv/comfyui-user }
        - { file: includes-media.txt, line: /srv/comfyui-loras }
        - { file: includes-media.txt, line: /srv/comfyui-extra-loras }

    - name: Throttle restic so backups yield to interactive workloads
      # CPUQuota is the effective pacing lever: restic's chunk/hash CPU
      # paces its disk reads, so capping CPU also caps the /bulk + /scratch
      # read churn that turned game chunk-loads into physical reads (root
      # cause in setup-earendil-zfs.yaml). 50% of one core sits well above
      # the ~0.4-core nightly average, so wall time barely moves — only the
      # bursts flatten. IOSchedulingClass is mostly a no-op on ZFS-backed
      # bind mounts; kept because it is free and covers any other IO.
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item }}.service.d/resource-control.conf"
        mode: "0644"
        content: |
          [Service]
          Nice=19
          CPUQuota=50%
          IOSchedulingClass=idle
      loop:
        - restic-backups
        - restic-host
        - restic-media
      notify: Reload systemd

    - name: Move restic timers out of evening gaming hours
      # aglarond is UTC. The vzdump job these feed on runs at 14:00
      # earendil-local (America/New_York), so 20:30 UTC stays >=45min
      # behind its worst-case finish in both EDT (16:30 local) and EST
      # (15:30 local). The empty OnCalendar= clears the value baked into
      # the on-box unit file — drop-ins append to list settings otherwise.
      # Persistent=true re-asserted: with on-demand fleet wake, a day that
      # starts after the slot must catch up at boot rather than skip.
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ item.unit }}.timer.d/schedule.conf"
        mode: "0644"
        content: |
          [Timer]
          OnCalendar=
          OnCalendar={{ item.when }}
          Persistent=true
      loop:
        - { unit: restic-backups, when: "*-*-* 20:30:00" }
        - { unit: restic-host, when: "*-*-* 21:15:00" }
        - { unit: restic-media, when: "Sun *-*-* 21:30:00" }
      notify: Reload systemd

    - name: Ensure the restic config dir exists (rebuild-before-restore case)
      # 0700: b2.env (B2 credentials) lives here once the backup restore lands.
      ansible.builtin.file:
        path: /root/.config/restic
        state: directory
        mode: "0700"

    - name: Exclude host dirs unreadable from the unprivileged CT
      # Established pattern (see descriptions/aglarond.md): secrets-bearing
      # /etc dirs the mapped root can't read are excluded rather than fought.
      # NOTE: this leaves the host's WireGuard private keys out of offsite
      # backup — deliberate for now; revisit if their recovery story changes.
      ansible.builtin.lineinfile:
        path: /root/.config/restic/excludes-host.txt
        create: true
        mode: "0644"
        line: "{{ item }}"
      loop:
        - /srv/host-etc/alloy
        - /srv/host-etc/wireguard

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
