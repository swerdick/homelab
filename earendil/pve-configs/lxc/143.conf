## mirdain (CT 143)
#
#GPU-worker k3s agent %E2%80%94 the AI/ROCm half of the amdgpu-sharing design
#(ROADMAP "Anduril Phase 2"). Joins gondor's cluster tainted
#`homelab.vingilot.internal/role=gpu%3ANoSchedule`; only workloads with a
#matching toleration (ComfyUI, llama-swap) land here.
#
### GPU is shared, not claimed
#
#Binds the same `/dev/dri/renderD129` + `/dev/kfd` as the anduril gaming CT
#(117) %E2%80%94 no card0 (KMS stays anduril's; compute never needs it). RDNA4 has no
#SR-IOV, so arbitration is operational%3A
#
#- `just gpu-gaming-mode` %E2%80%94 cordon + drain before a heavy gaming session
#- `just gpu-ai-mode` %E2%80%94 uncordon afterward
#- `just gpu-stop-mirdain` / `just gpu-start-mirdain` %E2%80%94 also frees the 16G RAM cap
#
#ROCm/Vulkan userspace lives in pod images, NOT in this CT (plain Trixie).
#If a pod ever drops privileged, use the GID actually stamped on the nodes
#(`stat -c %25g /dev/kfd` on earendil) %E2%80%94 at build time udev had stamped 991,
#which no longer matches `getent group render` (993), so check, don't assume.
#
### Config split
#
#Created with `pct` and IMPORTED into terraform (privileged-CT feature flags +
#bind mounts are root@pam-only via the API token %E2%80%94 HTTP 403). The raw lxc.*
#lines (GPU devices; k3s-in-LXC%3A kmsg, tun, proc%3Arw sys%3Arw, apparmor
#unconfined, cleared cap.drop), `features`, and the mpN binds are managed by
#ansible (setup-mirdain-lxc.yaml) against /etc/pve/lxc/143.conf; mirdain.tf
#carries `mount_point` blocks as documentation only (ignore_changes).
#
#Create command (fresh build)%3A
#
#    pct create 143 local%3Avztmpl/debian-13-standard_13.1-2_amd64.tar.zst \
#      --hostname mirdain --unprivileged 0 --ostype debian \
#      --cores 4 --cpuunits 50 --memory 16384 --swap 0 \
#      --rootfs local-zfs%3A24 \
#      --net0 name=eth0,bridge=vmbr0,ip=192.168.1.43/24,gw=192.168.1.1 \
#      --searchdomain vingilot.internal \
#      --features nesting=1,keyctl=1 \
#      --onboot 1 --startup order=30 \
#      --ssh-public-keys /root/.ssh/authorized_keys \
#      --start 0
#
#Then%3A setup-mirdain-lxc.yaml (host side) -> pct start 143 ->
#site-mirdain.yaml (in-guest converge + k3s join). `swap=0` is deliberate%3A
#kubelet-correct %E2%80%94 memory pressure fails loud in-cgroup instead of paging
#model weights to the rpool SSD.
#
### Storage
#
#- rootfs 24G on local-zfs%3A OS + k3s state only
#- mp0 scratch/mirdain-k3s (100G) at /var/lib/rancher%3A containerd image store
#- mp1 bulk/ai-models (150G) at /bulk/ai-models%3A model weights + generation
#  outputs (2770 root%3A10000 %E2%80%94 browsable via the smb `bulk` share). Quota
#  trimmed from the planned 300G%3A bulk had 267G free at creation (2026-08).
arch: amd64
cores: 4
cpuunits: 50
features: nesting=1,keyctl=1
hostname: mirdain
memory: 16384
mp0: /scratch/mirdain-k3s,mp=/var/lib/rancher,backup=0
mp1: /bulk/ai-models,mp=/bulk/ai-models,shared=1,backup=0
net0: name=eth0,bridge=vmbr0,gw=192.168.1.1,hwaddr=BC:24:11:42:9B:E7,ip=192.168.1.43/24,type=veth
onboot: 1
ostype: debian
rootfs: local-zfs:subvol-143-disk-0,size=24G
searchdomain: vingilot.internal
startup: order=30
swap: 0
lxc.cgroup2.devices.allow: c 226:* rwm
lxc.cgroup2.devices.allow: c 235:* rwm
lxc.cgroup2.devices.allow: c 10:200 rwm
lxc.cgroup2.devices.allow: c 1:11 rwm
lxc.mount.entry: /dev/dri/renderD129 dev/dri/renderD129 none bind,optional,create=file
lxc.mount.entry: /dev/kfd dev/kfd none bind,optional,create=file
lxc.mount.entry: /dev/kmsg dev/kmsg none bind,optional,create=file
lxc.mount.entry: /dev/net/tun dev/net/tun none bind,optional,create=file
lxc.mount.auto: proc:rw sys:rw
lxc.apparmor.profile: unconfined
lxc.cap.drop: 
